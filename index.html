<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classroom Layout Planner</title>
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Layout: drafting-table tool. Plan sheet on the left, a narrow schedule column on the right; stacks on phones. */
:root {
  --bg: #F2F4F3; --surface: #FFFFFF; --ink: #1B2120; --muted: #59645F; --line: #D5DCD8;
  --accent: #0F6E56; --accent-ink: #FFFFFF; --accent-soft: #E1F5EE;
  --danger: #B4381F; --danger-soft: #FBEAE5;
  --floor: #FFFFFF; --grid: #E8EDEA; --grid-5: #D3DBD7; --wall: #26302C; --park: #ECF0EE;
  --board: #5F5E5A; --window: #378ADD; --door: #D85A30; --closet: #BA7517; --dim: #9A5B0C;
  --tbl-f: #E1F5EE; --tbl-s: #0F6E56; --tbl-t: #085041;
  --chr-f: #F1EFE8; --chr-s: #5F5E5A;
  --oth-f: #EEEDFE; --oth-s: #534AB7; --oth-t: #3C3489;
  --sel: #0F6E56;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111514; --surface: #191E1C; --ink: #E5EBE8; --muted: #98A39E; --line: #2D3532;
  --accent: #5DCAA5; --accent-ink: #04342C; --accent-soft: #0B3B30;
  --danger: #F0997B; --danger-soft: #3A1E16;
  --floor: #171C1A; --grid: #212825; --grid-5: #2C3431; --wall: #C9D2CE; --park: #1D2321;
  --board: #B4B2A9; --window: #85B7EB; --door: #F0997B; --closet: #EF9F27; --dim: #EF9F27;
  --tbl-f: #085041; --tbl-s: #5DCAA5; --tbl-t: #E1F5EE;
  --chr-f: #444441; --chr-s: #B4B2A9;
  --oth-f: #3C3489; --oth-s: #AFA9EC; --oth-t: #EEEDFE;
  --sel: #5DCAA5; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111514; --surface: #191E1C; --ink: #E5EBE8; --muted: #98A39E; --line: #2D3532;
  --accent: #5DCAA5; --accent-ink: #04342C; --accent-soft: #0B3B30;
  --danger: #F0997B; --danger-soft: #3A1E16;
  --floor: #171C1A; --grid: #212825; --grid-5: #2C3431; --wall: #C9D2CE; --park: #1D2321;
  --board: #B4B2A9; --window: #85B7EB; --door: #F0997B; --closet: #EF9F27; --dim: #EF9F27;
  --tbl-f: #085041; --tbl-s: #5DCAA5; --tbl-t: #E1F5EE;
  --chr-f: #444441; --chr-s: #B4B2A9;
  --oth-f: #3C3489; --oth-s: #AFA9EC; --oth-t: #EEEDFE;
  --sel: #5DCAA5; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
.app { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.titleblock { min-width: 0; }
h1 { font-size: 26px; font-weight: 650; font-stretch: 78%; letter-spacing: 0.005em; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.sub .mono { font-family: var(--font-mono); font-size: 12px; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.lbl { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.savebox { display: flex; flex-direction: column; min-width: 0; flex: 0 1 380px; }
.saverow { display: flex; gap: 8px; }
.saverow input { flex: 1; min-width: 0; }
.filerow { display: flex; gap: 8px; margin-top: 8px; }
input[type="text"], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); }
button.danger.confirm { background: var(--danger); color: var(--surface); border-color: var(--danger); }
:is(button, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tgroup { display: flex; flex-direction: column; min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 12px; height: 9px; border-radius: 2px; border: 1px solid; flex: none; }
.sw-tbl { background: var(--tbl-f); border-color: var(--tbl-s); }
.sw-chr { background: var(--chr-f); border-color: var(--chr-s); width: 9px; }
.sw-oth { background: var(--oth-f); border-color: var(--oth-s); }
.toggles label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 6px 4px; cursor: pointer; }
.toggles input { accent-color: var(--accent); margin: 0; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
#plan { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint { margin: 6px 6px 2px; font-size: 12px; color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg); }
.panel { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.inv li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.inv .nm { flex: 1; min-width: 0; }
.inv .ct { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.inv .warn { color: var(--danger); }
.inv .spare { color: var(--muted); font-size: 12px; }
.checks li button { width: 100%; justify-content: flex-start; white-space: normal; text-align: left; background: var(--danger-soft); border-color: transparent; color: var(--ink); font-size: 12.5px; padding: 6px 9px; }
.checks li.ok { font-size: 13px; color: var(--accent); }
.checks li.more { font-size: 12px; color: var(--muted); }
#selinfo { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
#selinfo .mono { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
#selinfo .muted { color: var(--muted); }
.saved li { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.saved .row { display: flex; gap: 6px; flex-wrap: wrap; }
.saved .nm { font-weight: 600; overflow-wrap: anywhere; }
.saved .meta { font-size: 12px; color: var(--muted); }
.saved .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 500; }
.saved .empty { font-size: 13px; color: var(--muted); border: none; padding: 0; }
/* plan drawing */
#plan text { font-family: var(--font-ui); }
.floor { fill: var(--floor); }
.wall { fill: none; stroke: var(--wall); stroke-width: 2.5; stroke-linejoin: miter; }
.gridl { stroke: var(--grid); stroke-width: 0.6; }
.gridl5 { stroke: var(--grid-5); stroke-width: 0.8; }
.park { fill: var(--park); stroke: var(--line); stroke-dasharray: 5 4; }
.roomlbl { fill: var(--muted); font-size: 11px; }
.zone { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 0.8; stroke-dasharray: 4 4; opacity: 0.85; }
.zonelbl { fill: var(--danger); font-size: 10px; }
.it { cursor: grab; }
.dragging .it { cursor: grabbing; }
.it .body { stroke-width: 1; }
.tbl .body { fill: var(--tbl-f); stroke: var(--tbl-s); }
.tbl text { fill: var(--tbl-t); }
.chr .body { fill: var(--chr-f); stroke: var(--chr-s); }
.chr .back { stroke: var(--chr-s); stroke-width: 2.5; stroke-linecap: round; }
.oth .body { fill: var(--oth-f); stroke: var(--oth-s); }
.oth text { fill: var(--oth-t); font-size: 11px; font-weight: 500; pointer-events: none; }
.it.bad .body { stroke: var(--danger); stroke-width: 2; }
.selring { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }
.it.sel .body { stroke-width: 1.8; }
.marquee { fill: var(--accent-soft); fill-opacity: 0.5; stroke: var(--sel); stroke-width: 1; stroke-dasharray: 4 3; }
.dimline { stroke: var(--dim); stroke-width: 1; }
.dimtick { stroke: var(--dim); stroke-width: 1; }
.dimbg { fill: var(--floor); stroke: var(--dim); stroke-width: 0.6; }
.dimtxt { fill: var(--dim); font-family: var(--font-mono) !important; font-size: 10px; font-weight: 500; }
.scale line { stroke: var(--muted); stroke-width: 1; }
.scale text { fill: var(--muted); font-size: 10px; font-family: var(--font-mono) !important; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { h1 { font-size: 22px; } .toolbar { padding: 10px; gap: 10px 14px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* rooms and room setup */
input[type="number"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.roombox { display: flex; flex-direction: column; min-width: 0; flex: 0 1 320px; }
.roombox select { flex: 1; min-width: 0; }
.statusline { margin: -6px 0 0; min-height: 1.5em; font-size: 12.5px; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.form .row { display: flex; flex-direction: column; gap: 3px; }
.form .row > span { font-size: 12px; color: var(--muted); }
.form input[type="text"] { width: 100%; box-sizing: border-box; }
.form .check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.form .check input { accent-color: var(--accent); margin: 0; }
.form .muted, .panel .muted { color: var(--muted); }
.len { display: inline-flex; align-items: center; gap: 5px; }
.len input { width: 62px; box-sizing: border-box; }
.tips { margin: 0; padding-left: 18px !important; list-style: disc !important; font-size: 12.5px; color: var(--muted); gap: 4px !important; }
.helplink { color: var(--accent); font-weight: 600; }
.guide { stroke: var(--window); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
.checks li.warn button { background: color-mix(in srgb, var(--dim) 18%, transparent); }
.inv li.seats { font-weight: 600; padding-bottom: 6px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
#print-head { display: none; }
@media print {
  @page { margin: 12mm; }
  body { background: #fff !important; padding: 0 !important; }
  .top, .toolbar, .panel, .hint, .statusline { display: none !important; }
  #print-head { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #000; }
  .work { display: block; }
  .canvas { border: none; padding: 0; background: #fff; }
  #plan { width: 100%; height: 7in; }
}
.types { gap: 4px !important; }
.types button { width: 100%; justify-content: flex-start; gap: 8px; text-align: left; white-space: normal; }
.types button.on { border-color: var(--accent); background: var(--accent-soft); }
.types .nm { flex: 1; min-width: 0; }
.types .ct { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.form select { width: 100%; box-sizing: border-box; }
.fix .body { fill: var(--park); stroke: var(--muted); stroke-width: 1.2; }
.fix text { fill: var(--ink); font-size: 11px; font-weight: 500; pointer-events: none; }
.feat { stroke-width: 6; }
.f-board { stroke: var(--board); }
.f-window { stroke: var(--window); stroke-width: 4; stroke-dasharray: 10 6; }
.f-door { stroke: var(--door); }
.f-closet { stroke: var(--closet); }
.f-screen { stroke: var(--oth-s); }
.f-outlet { stroke: var(--dim); stroke-width: 9; }
.f-other { stroke: var(--muted); }
.feathit { stroke: transparent; stroke-width: 18; cursor: grab; }
.wallhit { stroke: transparent; stroke-width: 14; }
.wallhit.h { cursor: ns-resize; }
.wallhit.v { cursor: ew-resize; }
.wallpill { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.wallpill.h { cursor: ns-resize; }
.wallpill.v { cursor: ew-resize; }
.wallsel { stroke: var(--sel); stroke-width: 5; pointer-events: none; }
.walllen { fill: var(--muted); font-family: var(--font-mono) !important; font-size: 10px; pointer-events: none; }
.setup .it { opacity: 0.3; pointer-events: none; }
.setup .fix, .setup .zone { cursor: grab; }
.arrange .fix, .arrange .zone { pointer-events: none; }
.setsel { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }
.handle { fill: var(--surface); stroke: var(--sel); stroke-width: 1.5; cursor: nwse-resize; }
.oldroom { fill: none; stroke: var(--grid-5); stroke-width: 2; }
.drawline { fill: none; stroke: var(--sel); stroke-width: 2.5; stroke-linejoin: miter; }
.drawprev { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 5 4; }
.drawpt { fill: var(--sel); }
.drawstart { fill: var(--surface); stroke: var(--sel); stroke-width: 2; }
.ruler { fill: var(--muted); font-family: var(--font-mono) !important; font-size: 10px; }
</style>
</head>
<body>
<template id="shell">
<div class="app">
  <header class="top">
    <div class="titleblock">
      <h1>Classroom Layout Planner</h1>
      <p class="sub" id="sub"></p>
      <p class="sub"><a class="helplink" href="help.html" target="_blank" rel="noopener">How to use</a></p>
    </div>
    <div class="roombox">
      <label class="lbl" for="room-pick">Room</label>
      <div class="saverow"><select id="room-pick"></select><button id="btn-setup" type="button">Room setup</button></div>
    </div>
    <div class="savebox" id="savebox">
      <label class="lbl" for="layout-name">Layout name</label>
      <div class="saverow"><input id="layout-name" type="text" maxlength="60" autocomplete="off"><button id="btn-save" class="primary" type="button">Save layout</button></div>
      <div class="filerow">
        <button id="btn-download" type="button" title="Download a picture of this layout. The picture can be uploaded later to bring the room and layout back.">Download</button>
        <button id="btn-upload" type="button" title="Upload a picture made with Download to bring that room and layout back.">Upload</button>
        <button id="btn-print" type="button" title="Print this layout on one page.">Print</button>
        <input id="file-upload" type="file" accept="image/png,.png,application/json,.json" hidden>
      </div>
    </div>
  </header>
  <p id="status" class="statusline" aria-live="polite"></p>
  <div class="toolbar" id="tb-arrange" role="toolbar" aria-label="Planner tools">
    <div class="tgroup"><span class="lbl">Add</span><div class="btns" id="add-btns"></div></div>
    <div class="tgroup"><span class="lbl">Selection</span>
      <div class="btns">
        <button id="btn-rotate" type="button">Rotate 90°</button>
        <button id="btn-dup" type="button">Duplicate</button>
        <button id="btn-del" type="button" class="danger">Delete</button>
      </div>
    </div>
    <div class="tgroup"><span class="lbl">History</span>
      <div class="btns"><button id="btn-undo" type="button">Undo</button><button id="btn-redo" type="button">Redo</button></div>
    </div>
    <div class="tgroup"><span class="lbl">Show</span>
      <div class="btns toggles">
        <label for="opt-snap"><input type="checkbox" id="opt-snap" checked=""> Snap to 3″</label>
        <label for="opt-grid"><input type="checkbox" id="opt-grid" checked=""> 1′ grid</label>
        <label for="opt-zones"><input type="checkbox" id="opt-zones" checked=""> Clear zones</label>
        <label for="opt-gaps"><input type="checkbox" id="opt-gaps" checked=""> Gap distances</label>
        <label for="opt-align"><input type="checkbox" id="opt-align" checked=""> Alignment lines</label>
      </div>
    </div>
  </div>
  <div class="toolbar" id="tb-setup" role="toolbar" aria-label="Room setup tools" hidden>
    <div class="tgroup"><span class="lbl">This room</span>
      <div class="btns">
        <button id="btn-room-new" type="button">New room</button>
        <button id="btn-room-dup" type="button">Duplicate room</button>
        <button id="btn-room-del" type="button" class="danger">Delete room</button>
      </div>
    </div>
    <div class="tgroup"><span class="lbl">Shape</span>
      <div class="btns">
        <button id="btn-draw" type="button">Draw outline</button>
        <button id="btn-flip-lr" type="button">Flip left–right</button>
        <button id="btn-flip-fb" type="button">Flip front–back</button>
      </div>
    </div>
    <div class="tgroup"><span class="lbl">Add to a wall</span><div class="btns" id="feat-btns"></div></div>
    <div class="tgroup"><span class="lbl">Add to the floor</span>
      <div class="btns">
        <button id="btn-add-fixture" type="button">Fixture</button>
        <button id="btn-add-zone" type="button">Clear zone</button>
      </div>
    </div>
    <div class="tgroup"><span class="lbl">History</span>
      <div class="btns"><button id="btn-sundo" type="button">Undo</button><button id="btn-sredo" type="button">Redo</button></div>
    </div>
  </div>
  <div class="toolbar" id="tb-draw" role="toolbar" aria-label="Outline drawing tools" hidden>
    <div class="tgroup"><span class="lbl">Drawing the outline</span>
      <div class="btns">
        <button id="btn-draw-finish" type="button" class="primary">Finish</button>
        <button id="btn-draw-back" type="button">Remove last corner</button>
        <button id="btn-draw-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>
  <p id="print-head"></p>
  <main class="work">
    <section class="canvas" aria-label="Floor plan">
      <svg id="plan" class="arrange" viewBox="-40 -50 700 740" role="img" aria-label="Classroom floor plan you can edit"></svg>
      <p class="hint" id="hint"></p>
    </section>
    <aside class="panel" id="panel-arrange">
      <section><h2>In the room</h2><ul id="inventory" class="inv"></ul></section>
      <section><h2>Checks</h2><ul id="checks" class="checks"></ul></section>
      <section><h2>Selected</h2><div id="selinfo"></div></section>
      <section><h2>Saved layouts</h2><ul id="saved" class="saved"></ul></section>
    </aside>
    <aside class="panel" id="panel-setup" hidden>
      <section><h2>Room</h2><div id="roomform" class="form"></div></section>
      <section><h2>Selected</h2><div id="setupsel" class="form"></div></section>
      <section><h2>Furniture for this room</h2>
        <ul id="typelist" class="types"></ul>
        <div style="margin-top:8px"><button id="btn-type-add" type="button">Add furniture type</button></div>
      </section>
      <section><h2>Tips</h2>
        <ul class="tips">
          <li>Each wall shows its length. Drag that number to move the wall, or click it and type an exact length.</li>
          <li>Drag boards, windows and doors along the walls.</li>
          <li>Fixtures stay put when you arrange furniture.</li>
          <li>Click a furniture type to change its name, size or count.</li>
          <li>Furniture in a clear zone is flagged.</li>
        </ul>
      </section>
    </aside>
  </main>
</div>
</template>
<div id="root"></div>
<script id="app-code">
(function () {
  'use strict';
  /* Units are feet. S is pixels per foot. The room is a right-angled polygon whose
     smallest x and y are 0. Furniture below the room, in the gray strip, is "spare". */
  var S = 20, E = 0.01, SNAP = 0.25, SPARE_GAP = 0.73, PARK_TOP = 2.08, PARK_H = 5.5;
  /* Furniture types belong to a room. TYPES and ORDER always describe the active room's list.
     A type is { id, name, shape, w, h, cls, owned, chair }: cls is the color group, owned is how
     many the room has (null for no limit), chair means adding one also adds a chair. */
  var TYPES = {}, ORDER = [];
  var GROUPS = { tbl: { name: 'Student table (teal)', sw: 'sw-tbl' }, chr: { name: 'Chair (gray)', sw: 'sw-chr' }, oth: { name: 'Other (purple)', sw: 'sw-oth' } };
  var SHAPES = { rect: 'Rectangle', round: 'Round', kidney: 'Kidney' };
  /* The furniture of the original room. Rooms saved before furniture lists existed get this list. */
  function legacyTypes() {

    renderPlan();
  }
  function setupEnd() {
    var d = drag, note = '';
    drag = null; vbLock = null;
    if (d.moved) {
      sUndo.push(d.before); if (sUndo.length > 60) sUndo.shift(); sRedo = [];
      if (d.kind === 'wall') {
        var before = room.outline.length;
        room.outline = cleanOutline(room.outline);
        note = droppedNote(afterOutline(d.oldMaxY));
        if (room.outline.length !== before) ssel = null;
      } else if (d.kind === 'feature') refreshDoorZones();
      else if (d.kind === 'zone' || (d.kind === 'resize' && ssel.k === 'zone')) { var z = selObj(); if (z) z.auto = false; }
      saveStore();
      if (note) setStatus(note.trim());
    }
    renderAll();
  }
  svg.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var p = toFt(e);
    e.preventDefault();
    if (drawing) {
      var d = drawing;
      if (d.pts.length >= 3 && Math.abs(p.x - d.pts[0][0]) < 0.75 && Math.abs(p.y - d.pts[0][1]) < 0.75) { finishDraw(); return; }
      var q = drawNext(p), last = d.pts[d.pts.length - 1];
      if (!last || q[0] !== last[0] || q[1] !== last[1]) d.pts.push(q);
      d.cur = null; renderAll();
      setStatus(d.pts.length < 3 ? 'Click the next corner.' : 'Click the next corner, or click the first corner (the ring) to finish.');
      return;
    }
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (mode === 'setup') { setupDown(e, p); return; }
    var g = e.target.closest ? e.target.closest('.it') : null;
    if (g) {
      var id = g.getAttribute('data-id');
      if (e.shiftKey || e.metaKey || e.ctrlKey) {
        if (selected.has(id)) { selected.delete(id); drag = null; renderAll(); return; }
        selected.add(id);
      } else if (!selected.has(id)) { selected = new Set([id]); }
      var orig = new Map();
      selected.forEach(function (sid) { var it = find(sid); if (it) orig.set(sid, { x: it.x, y: it.y }); });
      drag = { kind: 'move', start: p, orig: orig, before: snapshot(), moved: false, align: alignStart(), guides: [] };
    } else {
      drag = { kind: 'box', start: p, cur: p, base: (e.shiftKey ? new Set(selected) : new Set()) };
      if (!e.shiftKey) selected.clear();
    }
    renderAll();
  });
  svg.addEventListener('pointermove', function (e) {
    var p = toFt(e);
    if (drawing) { drawing.cur = drawNext(p); renderPlan(); return; }
    if (!drag) return;
    if (mode === 'setup') { setupMove(p); return; }
    if (drag.kind === 'move') {
      var dx = p.x - drag.start.x, dy = p.y - drag.start.y;
      if (opts.snap) { dx = snap(dx); dy = snap(dy); }
      drag.guides = [];
      if (opts.align && drag.align.gb) { var al = alignMove(drag.align, dx, dy); dx = al.dx; dy = al.dy; drag.guides = al.guides; }
      if (dx || dy) drag.moved = true;
      drag.orig.forEach(function (o, id) { var it = find(id); if (it) { it.x = r2(o.x + dx); it.y = r2(o.y + dy); } });
      renderPlan();
    } else {
      drag.cur = p;
      var r = { x1: Math.min(drag.start.x, p.x), y1: Math.min(drag.start.y, p.y), x2: Math.max(drag.start.x, p.x), y2: Math.max(drag.start.y, p.y) };
      selected = new Set(drag.base);
      items.forEach(function (it) { if (overlap(box(it), r) > 0) selected.add(it.id); });
      renderPlan();
    }
  });
  function endDrag() {
    if (!drag) return;
    if (mode === 'setup') { setupEnd(); return; }
    if (drag.kind === 'move' && drag.moved) {
      undoStack.push(drag.before); if (undoStack.length > 120) undoStack.shift(); redoStack = []; saveStore();
    }
    drag = null; renderAll();
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', endDrag);

  /* ---------- controls ---------- */
  $('btn-rotate').addEventListener('click', rotateSel);
  $('btn-dup').addEventListener('click', dupSel);
  $('btn-del').addEventListener('click', delSel);
  $('btn-undo').addEventListener('click', undo);
  $('btn-redo').addEventListener('click', redo);
  ['snap', 'grid', 'zones', 'gaps', 'align'].forEach(function (k) {
    var el = $('opt-' + k); el.checked = opts[k];
    el.addEventListener('change', function () { opts[k] = el.checked; renderAll(); });
  });
  nameInput.addEventListener('input', function () { name = nameInput.value; saveStore(); });
  $('btn-setup').addEventListener('click', function () { setMode(mode === 'setup' ? 'arrange' : 'setup'); setStatus(''); });
  $('room-pick').addEventListener('change', function (e) {
    var v = e.target.value;
    if (v === '+new') { newRoom(); return; }
    setRoom(v); setMode(mode); setStatus('Switched to "' + room.name + '".');
  });
  $('btn-room-new').addEventListener('click', newRoom);
  $('btn-room-dup').addEventListener('click', dupRoom);
  $('btn-room-del').addEventListener('click', deleteRoom);
  $('btn-draw').addEventListener('click', startDraw);
  $('btn-draw-finish').addEventListener('click', finishDraw);
  $('btn-draw-back').addEventListener('click', function () { if (drawing && drawing.pts.length) { drawing.pts.pop(); drawing.cur = null; renderAll(); } });
  $('btn-draw-cancel').addEventListener('click', cancelDraw);
  $('btn-flip-lr').addEventListener('click', function () { flipRoom(true); });
  $('btn-flip-fb').addEventListener('click', function () { flipRoom(false); });
  $('btn-add-fixture').addEventListener('click', addFixture);
  $('btn-add-zone').addEventListener('click', addZone);
  $('btn-type-add').addEventListener('click', addType);
  $('btn-sundo').addEventListener('click', sUndoDo);
  $('btn-sredo').addEventListener('click', sRedoDo);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
    var mod = e.ctrlKey || e.metaKey, k = e.key, setup = mode === 'setup';
    if (drawing) { if (k === 'Escape') cancelDraw(); return; }
    if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); if (setup) { if (e.shiftKey) sRedoDo(); else sUndoDo(); } else if (e.shiftKey) redo(); else undo(); return; }
    if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); if (setup) sRedoDo(); else redo(); return; }
    if (mod) return;
    var st = e.shiftKey ? 1 : 0.25, dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
    if (setup) {
      if (k === 'Delete' || k === 'Backspace') { if (ssel && ssel.k !== 'wall') { e.preventDefault(); deleteSetupSel(); } }
      else if (k === 'Escape') { ssel = null; renderAll(); }
      else if (k.indexOf('Arrow') === 0 && ssel) { e.preventDefault(); nudgeSetup(dx, dy); }
      return;
    }
    if (k === 'r' || k === 'R') { rotateSel(); }
    else if (k === 'd' || k === 'D') { dupSel(); }
    else if (k === 'Delete' || k === 'Backspace') { if (selected.size) { e.preventDefault(); delSel(); } }
    else if (k === 'Escape') { selected.clear(); renderAll(); }
    else if (k.indexOf('Arrow') === 0 && selected.size) { e.preventDefault(); nudge(dx, dy); }
  });

  /* ---------- saving ---------- */
  $('btn-save').addEventListener('click', function () {
    var nm = (nameInput.value || '').trim().slice(0, 60) || 'My layout';
    name = nm; nameInput.value = nm;
    if (!storageWorks()) { setStatus('This browser is blocking saved data, so the layout could not be saved.'); return; }
    var entry = { name: nm, items: clean(items), savedAt: Date.now() };
    var replaced = room.layouts.some(function (s) { return s.name === nm; });
    room.layouts = [entry].concat(room.layouts.filter(function (s) { return s.name !== nm; })).slice(0, 30);
    saveStore();
    setStatus((replaced ? 'Updated "' : 'Saved "') + nm + '" in this browser.');
    renderSaved();
  });

  /* ---------- download and upload ----------
     Download makes a PNG picture of the layout and stores the room and layout data inside the
     same file, in a PNG text chunk. Upload reads that chunk back. FILE_V is the data format
     version: newer versions of the planner must keep reading older files.
       v1: { app, v, name, items, savedAt }           (the original room is implied)
       v2: adds room: { id, name, outline, features, fixtures, zones }
       v3: room also has types, its furniture list (older rooms get the original room's furniture) */
  var FILE_KEY = 'classroom-layout-planner', FILE_V = 3;
  var crcTable = null;
  function crc32(u8) {
    var n, k, c, i, crc = 0xFFFFFFFF;
    if (!crcTable) {
      crcTable = [];
      for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); crcTable[n] = c >>> 0; }
    }
    for (i = 0; i < u8.length; i++) crc = crcTable[(crc ^ u8[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function asciiJSON(o) {
    return JSON.stringify(o).replace(/[\u007f-￿]/g, function (ch) { return '\\u' + ('0000' + ch.charCodeAt(0).toString(16)).slice(-4); });
  }
  function isPNG(u8) {
    var sig = [137, 80, 78, 71, 13, 10, 26, 10];
    if (u8.length < 45) return false;
    for (var i = 0; i < 8; i++) if (u8[i] !== sig[i]) return false;
    return true;
  }
  function addPngText(u8, key, text) {
    var head = 'tEXt' + key + '\u0000', body = new Uint8Array(head.length + text.length), i;
    for (i = 0; i < head.length; i++) body[i] = head.charCodeAt(i);
    for (i = 0; i < text.length; i++) body[head.length + i] = text.charCodeAt(i);
    /* The first chunk (IHDR) always ends at byte 33. The text chunk goes right after it. */
    var out = new Uint8Array(u8.length + body.length + 8), dv = new DataView(out.buffer);
    out.set(u8.subarray(0, 33), 0);
    dv.setUint32(33, body.length - 4);
    out.set(body, 37);
    dv.setUint32(37 + body.length, crc32(body));
    out.set(u8.subarray(33), 41 + body.length);
    return out;
  }
  function readPngText(u8, key) {
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), p = 8;
    while (p + 12 <= u8.length) {
      var len = dv.getUint32(p), type = String.fromCharCode(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
      var s = p + 8, e = s + len;
      if (e > u8.length || type === 'IEND') break;
      if (type === 'tEXt') {
        var z = s; while (z < e && u8[z] !== 0) z++;
        var k = '', i;
        for (i = s; i < z; i++) k += String.fromCharCode(u8[i]);
        if (k === key) {
          var parts = [];
          for (i = z + 1; i < e; i += 8192) parts.push(String.fromCharCode.apply(null, u8.subarray(i, Math.min(e, i + 8192))));
          return parts.join('');
        }
      }
      p = e + 4;
    }
    return null;
  }
  function pictureSVG(title, vb) {
    var NS = 'http://www.w3.org/2000/svg', c = svg.cloneNode(true);
    c.setAttribute('xmlns', NS);
    c.setAttribute('data-theme', 'light');
    c.setAttribute('width', vb.w * 2); c.setAttribute('height', vb.h * 2);
    c.setAttribute('class', 'arrange');
    var over = c.querySelector('#g-over'); if (over) over.innerHTML = '';
    Array.prototype.forEach.call(c.querySelectorAll('.selring'), function (n) { n.parentNode.removeChild(n); });
    Array.prototype.forEach.call(c.querySelectorAll('.it.sel'), function (n) { n.classList.remove('sel'); });
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', vb.x + 10); t.setAttribute('y', vb.y + 18); t.setAttribute('font-size', '14'); t.setAttribute('font-weight', '600'); t.setAttribute('fill', '#1B2120');
    t.textContent = title;
    c.insertBefore(t, c.firstChild);
    var bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('x', vb.x); bg.setAttribute('y', vb.y); bg.setAttribute('width', vb.w); bg.setAttribute('height', vb.h); bg.setAttribute('fill', '#FFFFFF');
    c.insertBefore(bg, c.firstChild);
    var st = document.createElementNS(NS, 'style');
    st.textContent = $('app-style').textContent;
    c.insertBefore(st, c.firstChild);
    return new XMLSerializer().serializeToString(c);
  }
  function fileName(nm) {
    var base = nm.replace(/[^A-Za-z0-9 _-]+/g, '').trim().replace(/\s+/g, '-');
    return (base || 'classroom-layout') + '.png';
  }
  function downloadLayout() {
    var nm = (nameInput.value || '').trim().slice(0, 60) || 'My layout';
    var data = { app: FILE_KEY, v: FILE_V, name: nm, items: clean(items), savedAt: Date.now(), room: roomGeom(room) };
    function fail() { setStatus('The picture could not be made in this browser.'); }
    setStatus('Making the picture…');
    selected.clear(); renderAll();
    var vb = viewBox(), img = new Image();
    img.onerror = fail;
    img.onload = function () {
      try {
        var cv = document.createElement('canvas'); cv.width = vb.w * 2; cv.height = vb.h * 2;
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (blob) {
          if (!blob) { fail(); return; }
          var fr = new FileReader();
          fr.onerror = fail;
          fr.onload = function () {
            var out = addPngText(new Uint8Array(fr.result), FILE_KEY, asciiJSON(data));
            var url = URL.createObjectURL(new Blob([out], { type: 'image/png' }));
            var a = document.createElement('a'), fn = fileName(room.name + ' ' + nm);
            a.href = url; a.download = fn; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
            setStatus('Downloaded ' + fn + '. Keep the file itself: uploading it brings this room and layout back.');
          };
          fr.readAsArrayBuffer(blob);
        }, 'image/png');
      } catch (err) { fail(); }
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pictureSVG(room.name + ' · ' + nm, vb));
  }
  /* Finds the stored room a file belongs to, or adds the file's room as a new one. */
  function roomForFile(roomData) {
    var g = roomData ? sanitizeRoom(roomData, false) : sanitizeRoom(defaultRoom(), false);
    if (!g) return null;
    sync();
    var match = store.rooms.filter(function (r) { return geomKey(r) === geomKey(g); })[0];
    if (match) return { room: match, added: false };
    if (store.rooms.some(function (r) { return r.id === g.id; })) { g.id = newId('r'); g.name = (g.name + ' (uploaded)').slice(0, 60); }
    store.rooms.push(g);
    return { room: g, added: true };
  }
  function openFromFile(data) {
    if (!data || data.app !== FILE_KEY || !Array.isArray(data.items)) { setStatus('That file is not a layout from this planner.'); return; }
    if (Number(data.v) > FILE_V) { setStatus('That file was made with a newer version of the planner. Refresh this page and try again.'); return; }
    var target = roomForFile(data.room);
    if (!target) { setStatus('The room in that file could not be read.'); return; }
    var nm = (typeof data.name === 'string' && data.name.trim()) ? data.name.trim().slice(0, 60) : 'Uploaded layout';
    if (target.room !== room) setRoom(target.room.id);
    var h = hydrate(data.items);
    commit(); items = h; name = nm; nameInput.value = nm; selected.clear();
    saveStore(); setMode('arrange');
    setStatus('Opened "' + nm + '" in ' + (target.added ? 'a new room, "' : 'your room "') + room.name + '". Choose Save layout to keep it in this browser.');
  }
  function addSavedFromFile(list, roomData) {
    if (!storageWorks()) { setStatus('This browser is blocking saved data, so the layouts could not be added.'); return; }
    var target = roomForFile(roomData);
    if (!target) { setStatus('The room in that file could not be read.'); return; }
    var add = cleanLayouts(list, typeMap(target.room.types));
    if (!add.length) { setStatus('That file has no saved layouts in it.'); return; }
    var names = new Set(add.map(function (s) { return s.name; }));
    target.room.layouts = add.concat(target.room.layouts.filter(function (s) { return !names.has(s.name); })).slice(0, 30);
    if (target.room !== room) setRoom(target.room.id);
    saveStore(); setMode('arrange');
    setStatus('Added ' + add.length + (add.length === 1 ? ' saved layout' : ' saved layouts') + ' to "' + room.name + '".');
  }
  function readUpload(file) {
    var fr = new FileReader();
    fr.onerror = function () { setStatus('That file could not be read.'); };
    fr.onload = function () {
      var u8 = new Uint8Array(fr.result), data = null;
      if (isPNG(u8)) {
        var text = readPngText(u8, FILE_KEY);
        if (!text) { setStatus('That picture has no layout data in it. Use the file made by Download, not a screenshot or a copy from a document or chat.'); return; }
        try { data = JSON.parse(text); } catch (e) { data = null; }
        openFromFile(data);
        return;
      }
      try { data = JSON.parse(new TextDecoder('utf-8').decode(u8)); } catch (e2) { data = null; }
      if (data && Array.isArray(data.saved)) addSavedFromFile(data.saved, data.room);
      else if (data && Array.isArray(data.items)) openFromFile(data);
      else setStatus('That file is not a layout from this planner. Choose a picture made by Download.');
    };
    fr.readAsArrayBuffer(file);
  }
  $('btn-download').addEventListener('click', downloadLayout);
  /* Print shows only the plan, in the light theme, under a one-line heading. See the @media print styles. */
  $('btn-print').addEventListener('click', function () {
    selected.clear(); renderAll();
    var nm = (nameInput.value || '').trim() || 'Untitled layout', seats = seatCount();
    $('print-head').textContent = room.name + ' · ' + nm + ' · ' + seats + (seats === 1 ? ' seat' : ' seats') + ' · ' + new Date().toLocaleDateString();
    document.documentElement.setAttribute('data-theme', 'light');
    window.print();
  });
  window.addEventListener('afterprint', function () { document.documentElement.removeAttribute('data-theme'); });
  $('btn-upload').addEventListener('click', function () { $('file-upload').click(); });
  $('file-upload').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) readUpload(f);
  });

  /* The starter furniture chart. If it can't be loaded, the built-in copy above is used. */
  if (window.fetch && /^https?:$/.test(location.protocol)) {
    fetch('furniture.csv', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { var s = parseStarter(t); if (s.length) STARTER = s; }).catch(function () { /* keep the built-in list */ });
  }

  renderAll();
})();
</script>
